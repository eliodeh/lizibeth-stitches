{{define "booking-content"}}

<section class="new-booking">

    <div class="booking-header">
        <h1>Book Your Appointment</h1>
        <p>Fill in your details below</p>
    </div>

    {{if .Error}}
    <div class="error-box">
        ⚠ {{.Error}}
    </div>
    {{end}}

    <form method="POST"
          action="/booking/new"
          class="booking-form">

        <!-- SERVICE SELECTION -->
        <div class="form-section">
            <h2>1. Choose Your Service</h2>
            <div class="service-options">
                <label class="service-option">
                    <input type="radio"
                           name="service"
                           value="consultation"
                           required>
                    <div class="option-card">
                        <h3>👗 Consultation</h3>
                        <p>1 hour 30 minutes • ₦10,000</p>
                    </div>
                </label>
                <label class="service-option">
                    <input type="radio"
                           name="service"
                           value="fitting">
                    <div class="option-card">
                        <h3>✂️ Dress Fitting</h3>
                        <p>2 hours • ₦15,000</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- DATE SELECTION -->
        <div class="form-section">
            <h2>2. Choose Your Date</h2>
            <div class="form-group">
                <label>Select Date</label>
                <input type="date"
                       name="date"
                       id="booking-date"
                       min=""
                       required>
                <p class="form-hint">
                    Monday to Saturday only
                </p>
            </div>
        </div>

        <!-- TIME SLOT -->
        <div class="form-section">
            <h2>3. Choose Your Time</h2>
            <div class="form-group">
                <label>Available Time Slots</label>
                <select name="time_slot"
                        id="time-slot"
                        required>
                    <option value="">
                        Select date and service first
                    </option>
                </select>
            </div>
        </div>

        <!-- CUSTOMER DETAILS -->
        <div class="form-section">
            <h2>4. Your Details</h2>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text"
                       name="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel"
                           name="phone"
                           placeholder="e.g. 08012345678"
                           required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email"
                           name="email"
                           placeholder="your@email.com">
                </div>
            </div>

            <div class="form-group">
                <label>Additional Notes</label>
                <textarea name="notes"
                          rows="4"
                          placeholder="Tell us anything we should know. For example: I want a red gown for a dinner event">
                </textarea>
            </div>
        </div>

        <button type="submit" class="book-btn">
            Confirm Booking
        </button>

    </form>

</section>

{{end}}
